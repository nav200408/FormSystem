spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/form_database}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:secretpassword}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

app.jwt.secret=${JWT_SECRET:testsecret}
app.jwt.expiration-ms=${JWT_EXPIRATION:604800000}

server.servlet.context-path=/api